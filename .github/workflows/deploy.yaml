name: Test Workflow

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Dependencies (mock)
        run: echo "Installing dependencies..." # Simulate the npm install step

      - name: Lint Code (mock)
        run: echo "Running lint..." # Simulate linting

      - name: Run Tests (mock)
        run: echo "Running tests..." # Simulate tests
        # If you want to actually run a simple test, you can create a mock test script, e.g.:
        # run: node -e "console.log('Running mock tests')"

  deploy-to-production:
    runs-on: ubuntu-latest
    needs: deploy
    environment:
      name: test
    steps:
      - name: Wait for approval (mock)
        run: echo "Waiting for manual approval to proceed with deployment."
          echo ${{ secrets.TEST_SECRET }}

  deploy-prod:
    runs-on: ubuntu-latest
    needs: deploy-to-production
    steps:
      - name: Deploy to Production (mock)
        run: echo "Simulating production deployment..."
